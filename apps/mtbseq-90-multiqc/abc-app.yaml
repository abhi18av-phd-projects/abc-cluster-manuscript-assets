version: "1.0"
name: mtbseq-90-multiqc
project: <your-group>          # the group you deploy as

framework: static

# The report itself, published straight from disk. No image, no registry, no
# Dockerfile: the platform serves these files and Nomad fetches them onto the
# node before the task starts. A single file is served as index.html.
# Limit: 100 MiB.
content: ./multiqc_report.html

port: 8080
health: /

access: team
expose: [private]              # private | shared | public

resources:
  cpu: 200                     # MHz — a file server needs very little
  memory: 128                  # MiB
