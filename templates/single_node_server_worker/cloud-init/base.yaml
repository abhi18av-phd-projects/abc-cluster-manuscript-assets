#cloud-config
# abc-node single-node SYSTEMD variant
#
# ⚠  SINGLE-USER ONLY — Nomad -dev mode has NO ACL.
#    All requests to :4646 are accepted regardless of token. Do not use this
#    cloud-init for shared or multi-user access. For multi-user deployments
#    use the single-node-multi/ topology (Nomad server+client, ACL enabled,
#    per-user ACL tokens issued via `abc auth issue-token`).
#
# Services installed as systemd units:
#   minio.service        — MinIO object storage          :9000 (HTTP)
#   minio-init.service   — creates tusd bucket (oneshot)
#   tusd.service         — TUS protocol upload server    :1080 (HTTP)
#   nomad.service        — Nomad -dev agent              :4646 (HTTP)
#
# Services run as Nomad jobs (auto-submitted at first boot):
#   fx-tusd-hook         — post-finish S3 rename hook    :14002 (HTTP, internal)
#
# Optional HTTPS layer (pulumi config set enableHttps true):
#   caddy.service        — HTTPS reverse proxy (systemd unit)
#                            :9443 → MinIO S3 :9000
#                            :9444 → MinIO console :9001
#                            :1443 → tusd :1080
#   gen-tls-cert         — Nomad batch job; generates self-signed cert with IP SAN
#
# Runtimes and task drivers:
#   docker    — Nomad Docker driver
#   podman    — rootless OCI (daemonless)
#   apptainer — Singularity-compatible HPC runtime; `singularity` symlink
#   java      — Nomad Java task driver (auto-detected); Liberica JDK 21 full
#   raw_exec  — enabled for fx-tusd-hook and gen-tls-cert Nomad jobs
#
# Version pins (change here only):
#   Nomad  1.11.2
#   MinIO  RELEASE.2024-12-18T13-15-44Z
#   tusd   v2.4.0
#
# Credentials (dev defaults):
#   MinIO root user/password: minioadmin / minioadmin
#   S3 region: us-east-1

packages:
  - docker.io
  - wget
  - unzip
  - curl
  - python3
  - openssl
  # Podman — rootless OCI runtime (complements Docker for HPC workflows)
  - podman
  # Apptainer (Singularity-compatible) dependencies
  - fuse2fs
  - libfuse2
  - libglib2.0-0
  - libseccomp2
  - squashfs-tools

write_files:

  # ── fx-tusd-hook script ─────────────────────────────────────────────────────
  - path: /opt/fx-tusd-hook/hook.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """
      hook.py — tusd post-finish hook: rename S3 object + ntfy notification.
      No external dependencies. AWS SigV4 signing implemented with stdlib only.
      """
      import datetime, hashlib, hmac, json, logging, os, sys
      import urllib.error, urllib.parse, urllib.request
      from http.server import BaseHTTPRequestHandler, HTTPServer

      logging.basicConfig(level=logging.INFO,
          format="%(asctime)s %(levelname)s %(message)s", stream=sys.stdout)

      PORT     = int(os.environ.get("PORT", "14002"))
      ENDPOINT = os.environ.get("MINIO_ENDPOINT", "http://127.0.0.1:9000").rstrip("/")
      BUCKET   = os.environ.get("MINIO_BUCKET", "tusd")
      REGION   = os.environ.get("AWS_REGION", "us-east-1")
      AK       = os.environ.get("AWS_ACCESS_KEY_ID", "minioadmin")
      SK       = os.environ.get("AWS_SECRET_ACCESS_KEY", "minioadmin")
      NTFY_URL = os.environ.get("NTFY_URL", "")

      def _sign(key, msg):
          return hmac.new(key, msg.encode(), hashlib.sha256).digest()

      def _signing_key(secret, date_stamp):
          return _sign(_sign(_sign(_sign(
              ("AWS4" + secret).encode(), date_stamp), REGION), "s3"), "aws4_request")

      def _s3_request(method, key, headers=None, body=b"", copy_source=None):
          now = datetime.datetime.utcnow()
          amz_date = now.strftime("%Y%m%dT%H%M%SZ")
          date_stamp = now.strftime("%Y%m%d")
          parsed = urllib.parse.urlparse(ENDPOINT)
          host = parsed.netloc
          url = f"{ENDPOINT}/{BUCKET}/{urllib.parse.quote(key, safe='/')}"
          body_hash = hashlib.sha256(body).hexdigest()
          hdrs = {"Host": host, "x-amz-date": amz_date, "x-amz-content-sha256": body_hash}
          if copy_source:
              hdrs["x-amz-copy-source"] = copy_source
          if headers:
              hdrs.update(headers)
          signed_headers = ";".join(sorted(k.lower() for k in hdrs))
          canonical_headers = "".join(
              f"{k.lower()}:{v}\n" for k, v in sorted(hdrs.items(), key=lambda x: x[0].lower()))
          canonical_request = "\n".join([
              method, f"/{BUCKET}/{urllib.parse.quote(key, safe='/')}", "",
              canonical_headers, signed_headers, body_hash])
          credential_scope = f"{date_stamp}/{REGION}/s3/aws4_request"
          string_to_sign = "\n".join(["AWS4-HMAC-SHA256", amz_date, credential_scope,
              hashlib.sha256(canonical_request.encode()).hexdigest()])
          sig = hmac.new(_signing_key(SK, date_stamp),
              string_to_sign.encode(), hashlib.sha256).hexdigest()
          auth = (f"AWS4-HMAC-SHA256 Credential={AK}/{credential_scope}, "
                  f"SignedHeaders={signed_headers}, Signature={sig}")
          hdrs["Authorization"] = auth
          req = urllib.request.Request(url, data=body or None, headers=hdrs, method=method)
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return resp.status, resp.read()
          except urllib.error.HTTPError as e:
              return e.code, e.read()

      def _exists(key):
          status, _ = _s3_request("HEAD", key)
          return status == 200

      def _copy(src_key, dst_key):
          copy_src = f"/{BUCKET}/{urllib.parse.quote(src_key, safe='/')}"
          status, body = _s3_request("PUT", dst_key, copy_source=copy_src)
          if status not in (200, 204):
              raise RuntimeError(f"S3 copy failed: {status} {body[:200]}")

      def _delete(key):
          status, body = _s3_request("DELETE", key)
          if status not in (200, 204):
              raise RuntimeError(f"S3 delete failed: {status} {body[:200]}")

      def _first(*values):
          return next((v for v in values if isinstance(v, str) and v), "")

      def _source_key(upload):
          storage = upload.get("Storage") or upload.get("storage") or {}
          s3info  = storage.get("S3") or storage.get("s3") or {}
          uid     = _first(upload.get("ID"), upload.get("id"))
          if uid and "+" in uid:
              uid = uid.split("+", 1)[0]
          return _first(s3info.get("Key"), s3info.get("ObjectKey"),
                        s3info.get("object_key"), s3info.get("Object"), uid)

      def _fmt_size(b):
          b = int(b or 0)
          if b < 1024:    return f"{b} B"
          if b < 1 << 20: return f"{b / 1024:.1f} KB"
          if b < 1 << 30: return f"{b / (1 << 20):.1f} MB"
          return f"{b / (1 << 30):.2f} GB"

      def handle_upload(payload):
          event  = payload.get("Event") or payload.get("event") or {}
          upload = event.get("Upload") or event.get("upload") or {}
          meta   = upload.get("MetaData") or upload.get("metadata") or {}
          size   = upload.get("Size") or upload.get("size") or 0
          desired = _first(meta.get("filename"), meta.get("name"))
          src     = _source_key(upload)
          logging.info("hook: upload finished  src=%s  desired=%s  size=%s",
                       src or "(unknown)", desired or "(unnamed)", _fmt_size(size))
          if not src:
              logging.warning("hook: cannot determine source key; skipping rename")
              _notify(desired or "(unnamed)", size, desired or "(unnamed)")
              return
          if not desired or src == desired:
              logging.info("hook: no rename needed (key=%s)", src)
              _notify(src, size, src)
              return
          dst      = desired
          src_info = f"{src}.info"
          dst_info = f"{dst}.info"
          if _exists(dst) or _exists(dst_info):
              stem, dot, ext = desired.partition(".")
              suffix = src[:8]
              dst = f"{stem}__{suffix}{dot}{ext}" if dot else f"{stem}__{suffix}"
              dst_info = f"{dst}.info"
              logging.info("hook: name collision, using %s", dst)
          try:
              logging.info("hook: copy s3://%s/%s → %s", BUCKET, src, dst)
              _copy(src, dst)
              _delete(src)
              if _exists(src_info):
                  _copy(src_info, dst_info)
                  _delete(src_info)
              logging.info("hook: renamed OK")
          except Exception as exc:
              logging.error("hook: rename failed: %s", exc)
              _notify(desired, size, src)
              return
          _notify(desired, size, dst)

      def _notify(filename, size, final_key):
          if not NTFY_URL:
              return
          topic = NTFY_URL.rstrip("/").rsplit("/", 1)[-1]
          base  = "/".join(NTFY_URL.rstrip("/").rsplit("/", 1)[:-1])
          msg   = f"{BUCKET}/{final_key}\nOriginal name: {filename}\nSize: {_fmt_size(size)}"
          data  = json.dumps({"topic": topic, "title": "tusd: upload complete",
              "message": msg, "tags": ["inbox_tray"], "priority": 3}).encode()
          req = urllib.request.Request(base, data=data)
          req.add_header("Content-Type", "application/json")
          tok = os.environ.get("NTFY_TOKEN", "")
          if tok:
              req.add_header("Authorization", f"Bearer {tok}")
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  logging.info("hook: ntfy %s → HTTP %d", filename, resp.status)
          except Exception as exc:
              logging.warning("hook: ntfy error: %s", exc)

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/healthz":
                  self._respond(200, b"ok\n")
              else:
                  self._respond(404, b"not found\n")
          def do_POST(self):
              if self.path != "/hook":
                  self._respond(404, b"not found\n")
                  return
              length = int(self.headers.get("Content-Length", "0"))
              body   = self.rfile.read(length) if length > 0 else b"{}"
              try:
                  payload = json.loads(body.decode("utf-8"))
                  handle_upload(payload)
              except Exception:
                  logging.exception("hook: unexpected error")
              self._respond(200, b"{}\n", ct="application/json")
          def _respond(self, code, body, ct="text/plain"):
              self.send_response(code)
              self.send_header("Content-Type", ct)
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
          def log_message(self, fmt, *args):
              logging.info("http: " + fmt, *args)

      if __name__ == "__main__":
          server = HTTPServer(("0.0.0.0", PORT), Handler)
          logging.info("hook: listening on 0.0.0.0:%d  bucket=%s  endpoint=%s",
                       PORT, BUCKET, ENDPOINT)
          try:
              server.serve_forever()
          except KeyboardInterrupt:
              logging.info("hook: shutting down")
              import sys; sys.exit(0)

  # ── minio-init script ────────────────────────────────────────────────────────
  # Waits for MinIO to be healthy, then creates the tusd bucket idempotently.
  - path: /usr/local/bin/minio-init.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      echo "minio-init: waiting for MinIO to be ready..."
      until curl -sf http://127.0.0.1:9000/minio/health/live; do
        sleep 2
      done
      echo "minio-init: MinIO healthy"
      mc alias set local http://127.0.0.1:9000 minioadmin minioadmin --api S3v4
      mc mb local/tusd --ignore-existing
      echo "minio-init: bucket 'tusd' ready"

  # ── Nomad config: enable raw_exec driver ─────────────────────────────────────
  # raw_exec is disabled by default even in -dev mode; required for
  # fx-tusd-hook and gen-tls-cert Nomad jobs.
  - path: /etc/nomad.d/nomad.hcl
    permissions: '0644'
    content: |
      plugin "raw_exec" {
        config {
          enabled = true
        }
      }

  # ── Nomad job: fx-tusd-hook ───────────────────────────────────────────────────
  # Long-running service job — auto-submitted at first boot.
  # Nomad restarts it on failure; persists in state across reboots.
  - path: /opt/nomad/jobs/fx-tusd-hook.nomad.hcl
    permissions: '0644'
    content: |
      job "fx-tusd-hook" {
        datacenters = ["dc1"]
        type        = "service"

        group "hook" {
          count = 1

          network {
            port "http" { static = 14002 }
          }

          service {
            name     = "fx-tusd-hook"
            port     = "http"
            provider = "nomad"

            check {
              type     = "http"
              path     = "/healthz"
              interval = "15s"
              timeout  = "3s"
            }
          }

          task "hook" {
            driver = "raw_exec"

            config {
              command = "/usr/bin/python3"
              args    = ["/opt/fx-tusd-hook/hook.py"]
            }

            env {
              PORT                  = "14002"
              MINIO_ENDPOINT        = "http://127.0.0.1:9000"
              MINIO_BUCKET          = "tusd"
              AWS_ACCESS_KEY_ID     = "minioadmin"
              AWS_SECRET_ACCESS_KEY = "minioadmin"
              AWS_REGION            = "us-east-1"
            }

            resources {
              cpu    = 100
              memory = 64
            }
          }
        }
      }

  # ── systemd service: minio ───────────────────────────────────────────────────
  - path: /etc/systemd/system/minio.service
    content: |
      [Unit]
      Description=MinIO Object Storage (abc-node systemd)
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=minio
      Group=minio
      ExecStart=/usr/local/bin/minio server /data/minio \
        --address ":9000" \
        --console-address ":9001"
      Environment=MINIO_ROOT_USER=minioadmin
      Environment=MINIO_ROOT_PASSWORD=minioadmin
      Restart=on-failure
      RestartSec=5
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target

  # ── systemd service: minio-init ─────────────────────────────────────────────
  - path: /etc/systemd/system/minio-init.service
    content: |
      [Unit]
      Description=MinIO bucket initialisation (create tusd bucket)
      After=minio.service
      Requires=minio.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/minio-init.sh

      [Install]
      WantedBy=multi-user.target

  # ── systemd service: tusd ────────────────────────────────────────────────────
  # Depends on minio-init (bucket must exist) and nomad (hook job comes from Nomad).
  # ExecStartPre polls for the fx-tusd-hook Nomad job to become healthy.
  # Non-fatal: tusd starts even if hook is temporarily unavailable.
  - path: /etc/systemd/system/tusd.service
    content: |
      [Unit]
      Description=tusd TUS resumable upload server
      After=minio-init.service nomad.service
      Requires=minio-init.service

      [Service]
      ExecStartPre=/bin/bash -c 'for i in $(seq 1 30); do curl -sf http://127.0.0.1:14002/healthz && { echo "fx-tusd-hook ready"; exit 0; }; sleep 2; done; echo "WARNING: fx-tusd-hook not ready after 60s; starting tusd anyway"'
      ExecStart=/usr/local/bin/tusd \
        -host=0.0.0.0 \
        -port=1080 \
        -s3-bucket=tusd \
        -s3-endpoint=http://127.0.0.1:9000 \
        -hooks-http=http://127.0.0.1:14002/hook \
        -hooks-enabled-events=post-finish
      Environment=AWS_ACCESS_KEY_ID=minioadmin
      Environment=AWS_SECRET_ACCESS_KEY=minioadmin
      Environment=AWS_REGION=us-east-1
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # ── systemd service: nomad ────────────────────────────────────────────────────
  - path: /etc/systemd/system/nomad.service
    content: |
      [Unit]
      Description=Nomad Agent (dev mode — abc-node single-node)
      Documentation=https://developer.hashicorp.com/nomad/docs
      Wants=network-online.target docker.service
      After=network-online.target docker.service

      [Service]
      ExecStart=/usr/local/bin/nomad agent -dev -bind=0.0.0.0 -log-level=INFO -data-dir=/opt/nomad/data -config=/etc/nomad.d
      ExecReload=/bin/kill -HUP $MAINPID
      KillMode=process
      KillSignal=SIGINT
      LimitNOFILE=65536
      LimitNPROC=infinity
      Restart=on-failure
      RestartSec=2
      TasksMax=infinity

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── Apptainer v1.3.4 + singularity symlink ───────────────────────────────────
  - wget -q https://github.com/apptainer/apptainer/releases/download/v1.3.4/apptainer_1.3.4_amd64.deb -O /tmp/apptainer.deb
  - apt-get install -y /tmp/apptainer.deb
  - rm /tmp/apptainer.deb
  - ln -sf /usr/bin/apptainer /usr/local/bin/singularity

  # ── Liberica JDK 21 (enables Nomad Java task driver via auto-detection) ───────
  - wget -q https://download.bell-sw.com/java/21.0.7+9/bellsoft-jdk21.0.7+9-linux-amd64.deb -O /tmp/liberica-jdk21.deb
  - apt-get install -y /tmp/liberica-jdk21.deb
  - rm /tmp/liberica-jdk21.deb

  # ── Nomad ─────────────────────────────────────────────────────────────────────
  - mkdir -p /opt/nomad/data /opt/nomad/jobs /etc/nomad.d
  - wget -q https://releases.hashicorp.com/nomad/1.11.2/nomad_1.11.2_linux_amd64.zip -O /tmp/nomad.zip
  - unzip /tmp/nomad.zip -d /usr/local/bin/
  - chmod +x /usr/local/bin/nomad
  - rm /tmp/nomad.zip

  # ── MinIO server binary ────────────────────────────────────────────────────────
  - wget -q https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2024-12-18T13-15-44Z -O /usr/local/bin/minio
  - chmod +x /usr/local/bin/minio
  - useradd -r -s /sbin/nologin minio || true
  - mkdir -p /data/minio
  - chown -R minio:minio /data/minio

  # ── mc (MinIO client, used by minio-init.sh) ───────────────────────────────────
  - wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
  - chmod +x /usr/local/bin/mc

  # ── tusd binary ───────────────────────────────────────────────────────────────
  - wget -q https://github.com/tus/tusd/releases/download/v2.4.0/tusd_linux_amd64.tar.gz -O /tmp/tusd.tar.gz
  - mkdir -p /tmp/tusd-extract
  - tar -xzf /tmp/tusd.tar.gz -C /tmp/tusd-extract/
  - find /tmp/tusd-extract -name 'tusd' -type f -exec mv {} /usr/local/bin/tusd \;
  - chmod +x /usr/local/bin/tusd
  - rm -rf /tmp/tusd.tar.gz /tmp/tusd-extract

  # ── Docker (required by Nomad Docker driver) ───────────────────────────────────
  - systemctl enable --now docker

  # ── systemd reload + enable units ─────────────────────────────────────────────
  - systemctl daemon-reload
  - systemctl enable minio.service minio-init.service tusd.service nomad.service

  # ── Start minio first, then Nomad ─────────────────────────────────────────────
  - systemctl start minio.service
  - systemctl start minio-init.service
  - systemctl start nomad.service

  # ── Wait for Nomad API before submitting jobs (up to 90 s) ────────────────────
  - |
    for i in $(seq 1 30); do
      curl -sf http://127.0.0.1:4646/v1/status/leader >/dev/null 2>&1 && break
      sleep 3
    done
    curl -sf http://127.0.0.1:4646/v1/status/leader >/dev/null || { echo "ERROR: Nomad not ready after 90s"; exit 1; }

  # ── Submit fx-tusd-hook Nomad job ─────────────────────────────────────────────
  - NOMAD_ADDR=http://127.0.0.1:4646 nomad job run /opt/nomad/jobs/fx-tusd-hook.nomad.hcl

  # ── Wait for hook to be healthy, then start tusd ──────────────────────────────
  # tusd.service ExecStartPre will also poll, but starting healthy is cleaner.
  - |
    for i in $(seq 1 30); do
      curl -sf http://127.0.0.1:14002/healthz >/dev/null 2>&1 && break
      sleep 2
    done
  - systemctl start tusd.service
