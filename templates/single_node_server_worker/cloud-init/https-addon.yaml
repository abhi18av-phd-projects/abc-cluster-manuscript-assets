#cloud-config
# HTTPS addon for abc-node.
# Merged in by index.ts when pulumi config set enableHttps true.
#
# Adds:
#   caddy.service    — HTTPS reverse proxy (systemd unit)
#                        :9443 → MinIO S3 :9000
#                        :9444 → MinIO console :9001
#                        :1443 → tusd :1080
#   gen-tls-cert     — Nomad batch job; runs once to generate a self-signed cert
#                      with IP SAN for the VM's primary IPv4
#
# caddy.service depends on the cert file; its ExecStartPre polls up to 3 min.
# On subsequent reboots the cert file already exists; Caddy starts immediately.
#
# Version pins:
#   Caddy  v2.8.4
#
# To trust the self-signed cert on macOS:
#   multipass exec abc-node -- cat /etc/caddy/certs/server.crt \
#     > /tmp/abc-node.crt
#   sudo security add-trusted-cert -d -r trustRoot \
#     -k /Library/Keychains/System.keychain /tmp/abc-node.crt

write_files:

  # ── TLS cert generation script ─────────────────────────────────────────────
  # Detects the VM's primary IPv4 and issues a self-signed cert with
  # that IP as a Subject Alternative Name alongside localhost.
  - path: /usr/local/bin/gen-tls-cert.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      CERT_DIR=/etc/caddy/certs
      mkdir -p "$CERT_DIR"

      VM_IP=$(ip -4 addr show scope global | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -1)
      VM_IP=${VM_IP:-127.0.0.1}

      echo "gen-tls-cert: issuing cert for IP=${VM_IP}"

      openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes \
        -keyout "${CERT_DIR}/server.key" \
        -out    "${CERT_DIR}/server.crt" \
        -subj   "/CN=abc-node" \
        -addext "subjectAltName=IP:${VM_IP},IP:127.0.0.1,DNS:localhost"

      chmod 644 "${CERT_DIR}/server.crt"
      chmod 600 "${CERT_DIR}/server.key"
      echo "gen-tls-cert: done — ${CERT_DIR}/server.crt"

  # ── Nomad job: gen-tls-cert ────────────────────────────────────────────────
  # Batch job — runs once at first boot. caddy.service ExecStartPre polls for
  # /etc/caddy/certs/server.crt before starting.
  - path: /opt/nomad/jobs/gen-tls-cert.nomad.hcl
    permissions: '0644'
    content: |
      job "gen-tls-cert" {
        datacenters = ["dc1"]
        type        = "batch"

        group "cert" {
          count = 1

          task "generate" {
            driver = "raw_exec"

            config {
              command = "/usr/local/bin/gen-tls-cert.sh"
            }

            resources {
              cpu    = 200
              memory = 64
            }
          }
        }
      }

  # ── Caddyfile ──────────────────────────────────────────────────────────────
  # HTTPS reverse proxy — all TLS is manual (cert from gen-tls-cert Nomad job).
  - path: /etc/caddy/Caddyfile
    content: |
      {
          # Disable Caddy's auto-HTTPS / ACME — cert is managed by gen-tls-cert
          auto_https off
      }

      # MinIO S3 API — s3-compatible endpoint
      :9443 {
          tls /etc/caddy/certs/server.crt /etc/caddy/certs/server.key
          reverse_proxy 127.0.0.1:9000
      }

      # MinIO Console — web UI
      :9444 {
          tls /etc/caddy/certs/server.crt /etc/caddy/certs/server.key
          reverse_proxy 127.0.0.1:9001
      }

      # tusd — TUS resumable upload endpoint
      :1443 {
          tls /etc/caddy/certs/server.crt /etc/caddy/certs/server.key
          reverse_proxy 127.0.0.1:1080
      }

  # ── systemd service: caddy ─────────────────────────────────────────────────
  - path: /etc/systemd/system/caddy.service
    content: |
      [Unit]
      Description=Caddy HTTPS reverse proxy (abc-node systemd)
      After=network-online.target nomad.service
      Wants=network-online.target

      [Service]
      # Poll for TLS cert from gen-tls-cert Nomad batch job (up to ~3 min).
      ExecStartPre=/bin/bash -c 'for i in $(seq 1 60); do [ -f /etc/caddy/certs/server.crt ] && exit 0; sleep 3; done; echo "ERROR: TLS cert not found after 3 min"; exit 1'
      ExecStart=/usr/local/bin/caddy run \
        --config /etc/caddy/Caddyfile \
        --adapter caddyfile
      ExecReload=/usr/local/bin/caddy reload \
        --config /etc/caddy/Caddyfile \
        --adapter caddyfile
      Restart=on-failure
      RestartSec=5
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── Caddy v2.8.4 binary ────────────────────────────────────────────────────
  - wget -q https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz -O /tmp/caddy.tar.gz
  - mkdir -p /tmp/caddy-extract
  - tar -xzf /tmp/caddy.tar.gz -C /tmp/caddy-extract/
  - mv /tmp/caddy-extract/caddy /usr/local/bin/caddy
  - chmod +x /usr/local/bin/caddy
  - rm -rf /tmp/caddy.tar.gz /tmp/caddy-extract

  # ── Enable Caddy + generate cert via Nomad batch job ──────────────────────
  # Nomad is already running (base runcmd starts it before https-addon runs).
  - systemctl daemon-reload
  - systemctl enable caddy.service
  - NOMAD_ADDR=http://127.0.0.1:4646 nomad job run /opt/nomad/jobs/gen-tls-cert.nomad.hcl

  # ── Wait for cert file, then start Caddy ─────────────────────────────────
  - |
    for i in $(seq 1 60); do
      [ -f /etc/caddy/certs/server.crt ] && break
      sleep 3
    done
    [ -f /etc/caddy/certs/server.crt ] || { echo "ERROR: TLS cert not generated by gen-tls-cert Nomad job"; exit 1; }
  - systemctl start caddy.service
