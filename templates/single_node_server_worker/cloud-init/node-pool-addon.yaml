#cloud-config
# Node-pool alignment addon for abc-node.
# Merged in by index.ts when `pulumi config set enableNodePool true` (default on).
#
# WHY THIS EXISTS
#   The CLI generates user jobs with `node_pool = "compute"` (overridable with
#   `abc job run --node-pool`). A stock single-node deployment registers its
#   client in the `default` pool and creates no `compute` pool, so the very
#   first `abc job run` fails with:
#       job "..." is in nonexistent node pool "compute"
#   The platform's own fx-tusd-hook job sets no node_pool at all, so it lands in
#   `default`. Base and CLI therefore disagree about where work runs.
#
# WHAT THIS ADDS
#   - a `compute` node pool
#   - the client joins `compute`, matching the CLI's default
#   - fx-tusd-hook is pinned to `compute` so platform and user jobs agree
#
# A node belongs to exactly one pool, so both must name the same one.

write_files:
  # Namespaces do not survive, for the same reason platform jobs do not: Nomad
  # runs here in -dev mode, which discards server state on restart, and the
  # Pulumi program snapshots after cloud-init, which stops the instance. Applying
  # the namespace once from runcmd looks like it worked — cloud-init logs
  # "Successfully applied namespace" — and it is gone by the time a reviewer runs
  # anything. Observed: 'abc app deploy' failing with
  #     job "app-..." is in nonexistent namespace "abc-apps"
  #
  # The compute node pool needs no equivalent: the client declares node_pool in
  # its own config, so Nomad recreates the pool on every registration.
  - path: /usr/local/bin/abc-apply-namespaces
    permissions: '0755'
    content: |
      #!/bin/bash
      export NOMAD_ADDR="${NOMAD_ADDR:-http://127.0.0.1:4646}"
      for i in $(seq 1 40); do
        curl -sf "${NOMAD_ADDR}/v1/status/leader" >/dev/null 2>&1 && break
        sleep 3
      done
      nomad namespace apply -description "Scientific web apps deployed with abc app" abc-apps \
        && echo "namespace abc-apps ready"

  - path: /etc/systemd/system/abc-namespaces.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Apply abc namespaces to Nomad (re-runs each boot; -dev loses state)
      After=nomad.service
      Requires=nomad.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/abc-apply-namespaces

      [Install]
      WantedBy=multi-user.target

  # Nomad -dev fingerprints the loopback interface, so
  # `unique.network.ip-address` is 127.0.0.1 even though the agent advertises
  # the real address. The CLI defaults a pipeline head's NOMAD_ADDR to
  # `http://${attr.unique.network.ip-address}:4646`, so the head container
  # dials itself and every worker submit fails with:
  #     Failed to submit <task> -- Cause: java.net.ConnectException:
  #     Failed to connect to /127.0.0.1:4646
  # Pinning the client to the default-route interface makes the fingerprint the
  # node's real address, so `abc pipeline run` needs no --head-nomad-addr.
  - path: /usr/local/bin/abc-set-nomad-interface
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      IFACE=$(ip -o route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev"){print $(i+1); exit}}')
      [ -n "${IFACE:-}" ] || { echo "no default-route interface; leaving Nomad fingerprint alone"; exit 0; }
      printf 'client {\n  network_interface = "%s"\n}\n' "$IFACE" > /etc/nomad.d/network.hcl
      echo "nomad client pinned to interface $IFACE"

  - path: /etc/nomad.d/node-pool.hcl
    permissions: '0644'
    content: |
      client {
        node_pool = "compute"
      }

  - path: /opt/nomad/pools/compute.nomad.hcl
    permissions: '0644'
    content: |
      node_pool "compute" {
        description = "General compute pool — the CLI's default target for user jobs"
      }

runcmd:
  - /usr/local/bin/abc-set-nomad-interface
  - systemctl daemon-reload
  - systemctl enable --now abc-namespaces.service
  - mkdir -p /opt/nomad/pools

  # Create the pool before restarting the client into it, so registration lands
  # in an existing pool rather than creating an implicit one.
  - |
    for i in $(seq 1 30); do
      curl -sf http://127.0.0.1:4646/v1/status/leader >/dev/null 2>&1 && break
      sleep 3
    done
    NOMAD_ADDR=http://127.0.0.1:4646 nomad node pool apply /opt/nomad/pools/compute.nomad.hcl


  - systemctl restart nomad.service

  # Wait for the client to re-register in `compute` before anything is submitted.
  - |
    for i in $(seq 1 30); do
      POOL=$(NOMAD_ADDR=http://127.0.0.1:4646 nomad node status -json 2>/dev/null \
             | grep -o '"NodePool":"[^"]*"' | head -1 | cut -d'"' -f4)
      [ "$POOL" = "compute" ] && { echo "node registered in pool: compute"; break; }
      sleep 3
    done
