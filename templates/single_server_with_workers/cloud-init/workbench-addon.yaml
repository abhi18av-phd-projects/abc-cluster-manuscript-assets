    \ \"secret_key\": rsk,\n                       \"nomad_token\": rtd.get(\"SecretID\", \"\"), \"groups\"\
    : bare,\n                       \"claim_code\": code, \"slot_id\": srec[\"id\"] if srec else None}\n\
