  permissions: '0755'
- content: "# Register abc-auth-svc as a JupyterHub service.\n#\n# Without this the credential broker\
    \ can reach the hub but has no API token, so\n# POST /workbench/token fails with \"hub unreachable:\
    \ JUPYTERHUB_API_TOKEN not\n# configured\". The broker mints per-user tokens and starts servers on\
    \ the\n# user's behalf, which needs admin:users, admin:servers and tokens.\n#\n# The shared secret\
    \ lives only in /etc/abc/workbench.env (mode 0600), which\n# both this file and the abc-auth-svc unit\
    \ read; it is never written into the\n# hub database or into any Nomad job specification.\n_tok =\
    \ \"\"\ntry:\n    with open(\"/etc/abc/workbench.env\") as _f:\n        for _line in _f:\n       \
    \     if _line.startswith(\"JUPYTERHUB_API_TOKEN=\"):\n                _tok = _line.split(\"=\", 1)[1].strip()\n\
    \                break\nexcept OSError:\n    pass\n\nif _tok:\n    c.JupyterHub.services = [{\"name\"\
    : \"abc-auth-svc\", \"api_token\": _tok}]\n    c.JupyterHub.load_roles = [{\n        \"name\": \"\
    abc-auth-svc-role\",\n        \"scopes\": [\"admin:users\", \"admin:servers\", \"tokens\"],\n    \
    \    \"services\": [\"abc-auth-svc\"],\n    }]\n"
  path: /opt/tljh/config/jupyterhub_config.d/20-abc-auth-svc.py
  permissions: '0644'
