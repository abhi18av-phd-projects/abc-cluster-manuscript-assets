#cloud-config
packages:
- git
- curl
- unzip
runcmd:
- systemctl daemon-reload
- systemctl enable abc-workbench-install.service
write_files:
- content: 'export PATH=/usr/local/go/bin:$PATH

    '
  path: /etc/profile.d/go.sh
  permissions: '0644'
- content: "#!/bin/bash\n# Build abc-auth-svc from source into /opt/abc-auth-svc/.\nset -euo pipefail\n\
    export PATH=/usr/local/go/bin:$PATH\n# systemd starts this oneshot without HOME, and Go derives GOPATH,\
    \ GOMODCACHE\n# and GOCACHE from it. Without these the build fails immediately and\n# deterministically\
    \ on \"module cache not found: neither GOMODCACHE nor GOPATH\n# is set\" \u2014 retrying cannot help,\
    \ and the node ends up with the unit enabled\n# but no binary, restarting on 203/EXEC forever.\nexport\
    \ HOME=${HOME:-/root}\nexport GOPATH=${GOPATH:-$HOME/go}\nexport GOMODCACHE=${GOMODCACHE:-$GOPATH/pkg/mod}\n\
    export GOCACHE=${GOCACHE:-$HOME/.cache/go-build}\nGO_VERSION=${GO_VERSION:-1.27.0}\nif ! command -v\
    \ go >/dev/null 2>&1; then\n  curl -fsSL \"https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz\"\
    \ -o /tmp/go.tgz\n  rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz && rm -f /tmp/go.tgz\n\
    fi\nrm -rf /tmp/abc-auth-svc\ngit clone --depth 1 https://github.com/abc-cluster/abc-auth-svc.git\
    \ /tmp/abc-auth-svc\nmkdir -p /opt/abc-auth-svc\ncd /tmp/abc-auth-svc\n# Fetch modules first, so a\
    \ network failure is distinguishable from a\n# compile failure in the log. Back off properly: the\
    \ whole workbench is\n# installing at once and a cold module download is slower than it looks.\nfor\
    \ attempt in 1 2 3; do\n  if go mod download; then break; fi\n  echo \"go mod download attempt $attempt\
    \ failed; retrying\"\n  sleep $((attempt * 20))\ndone\nfor attempt in 1 2 3; do\n  if go build -trimpath\
    \ -o /opt/abc-auth-svc/abc-auth-svc .; then break; fi\n  echo \"go build attempt $attempt failed;\
    \ retrying\"\n  sleep $((attempt * 20))\ndone\n[ -x /opt/abc-auth-svc/abc-auth-svc ] || { echo \"\
    auth-svc build failed after 3 attempts\"; exit 1; }\n/opt/abc-auth-svc/abc-auth-svc -version || true\n\
    echo \"abc-auth-svc built\"\n"
  path: /usr/local/bin/abc-install-authsvc
  permissions: '0755'
- content: "#!/bin/bash\n# PocketBase holds workbench slot state. Published as a static binary.\nset -euo\
    \ pipefail\nPB_VERSION=${PB_VERSION:-0.23.4}\ncommand -v pocketbase >/dev/null 2>&1 && { echo \"pocketbase\
    \ present\"; exit 0; }\ncurl -fsSL -o /tmp/pb.zip \\\n  \"https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip\"\
    \nunzip -o -q /tmp/pb.zip -d /tmp/pb && install -m 0755 /tmp/pb/pocketbase /usr/local/bin/pocketbase\n\
    rm -rf /tmp/pb /tmp/pb.zip\nmkdir -p /opt/abc/pb_data\necho \"pocketbase installed\"\n"
  path: /usr/local/bin/abc-install-pocketbase
  permissions: '0755'
- content: '# Generated at provision time by abc-workbench-secrets.

    # Secrets are read from the environment only, never from flags.

    '
  path: /etc/abc/workbench.env
  permissions: '0640'
- content: '#!/bin/bash

    # Generate the per-deployment secrets the workbench services share.

    # Regenerating them invalidates existing sessions, so only generate once.

    set -euo pipefail

    mkdir -p /etc/abc

    f=/etc/abc/workbench.env

    grep -q SESSION_SECRET "$f" 2>/dev/null && { echo "secrets present"; exit 0; }

    gen() { head -c 32 /dev/urandom | base64 | tr -d ''\n=''; }

    cat > "$f" <<ENV

    SESSION_SECRET=$(gen)

    PB_ADMIN_PASSWORD=$(gen)

    OPERATOR_TOKEN=$(gen)

    ENV

    chmod 0640 "$f"

    echo "workbench secrets generated"

    '
  path: /usr/local/bin/abc-workbench-secrets
  permissions: '0755'
- content: '#!/bin/bash

    # Report which workbench components are present. Printed at the end of

    # provisioning so a half-built node is visible rather than silent.

    ok=0; bad=0

    chk() { if eval "$2"; then echo "  ok      $1"; ok=$((ok+1)); else echo "  MISSING $1"; bad=$((bad+1));
    fi; }

    echo "WORKBENCH components:"

    chk "pocketbase"   "command -v pocketbase >/dev/null"

    chk "tljh"         "[ -x /opt/tljh/hub/bin/jupyterhub ]"

    chk "abc-auth-svc" "[ -x /opt/abc-auth-svc/abc-auth-svc ]"

    chk "secrets"      "grep -q SESSION_SECRET /etc/abc/workbench.env 2>/dev/null"

    echo "WORKBENCH: $ok present, $bad missing"

    '
  path: /usr/local/bin/abc-workbench-status
  permissions: '0755'
- content: '[Unit]

    Description=PocketBase (workbench slot store)

    After=network-online.target

    Wants=network-online.target


    [Service]

    ExecStart=/usr/local/bin/pocketbase serve --http 127.0.0.1:8091 --dir /opt/abc/pb_data

    Restart=always

    RestartSec=3


    [Install]

    WantedBy=multi-user.target

    '
  path: /etc/systemd/system/abc-pocketbase.service
  permissions: '0644'
- content: '[Unit]

    Description=abc-auth-svc (workbench forward-auth and credential broker)

    After=abc-pocketbase.service

    Wants=abc-pocketbase.service


    [Service]

    # Secrets come from the environment only, never from flags, and the service

    # registers each one with its log redactor.

    EnvironmentFile=-/etc/abc/workbench.env

    EnvironmentFile=-/etc/abc/workbench-cluster.env

    ExecStart=/opt/abc-auth-svc/abc-auth-svc

    Restart=always

    RestartSec=3


    [Install]

    WantedBy=multi-user.target

    '
  path: /etc/systemd/system/abc-auth-svc.service
  permissions: '0644'
- content: "#!/bin/bash\n# Install every workbench component. Runs as a systemd oneshot AFTER boot\n#\
    \ rather than from cloud-init, because these installs take several minutes and\n# cloud-init's package\
    \ stage runs before runcmd \u2014 putting them inline delayed\n# the Nomad ACL bootstrap past its\
    \ readiness window and failed the deployment.\nset -uo pipefail\nexport DEBIAN_FRONTEND=noninteractive\n\
    apt-get update -qq >/dev/null 2>&1\napt-get install -y -qq python3-pip sqlite3 >/dev/null 2>&1\n/usr/local/bin/abc-workbench-secrets\
    \       || echo \"WORKBENCH secrets step failed\"\n/usr/local/bin/abc-workbench-secrets-extra || echo\
    \ \"WORKBENCH extra-secrets step failed\"\n/usr/local/bin/abc-install-pocketbase      || echo \"WORKBENCH\
    \ pocketbase step failed\"\n/usr/local/bin/abc-install-tljh            || echo \"WORKBENCH tljh step\
    \ failed\"\n/usr/local/bin/abc-install-authsvc         || echo \"WORKBENCH auth-svc step failed\"\n\
    systemctl daemon-reload\nsystemctl enable --now abc-pocketbase.service || echo \"WORKBENCH pocketbase\
    \ service failed\"\nsystemctl enable --now abc-auth-svc.service || echo \"WORKBENCH auth-svc service\
    \ failed\"\n# Seed groups, member slots and the reviewer account. Needs\n# PocketBase, the hub and\
    \ the broker all listening, so it runs last.\nsleep 5\n/usr/local/bin/abc-workbench-seed > /var/log/abc-workbench-seed.log\
    \ 2>&1 \\\n  || echo \"WORKBENCH seed step failed; see /var/log/abc-workbench-seed.log\"\n/usr/local/bin/abc-workbench-status\n\
    touch /var/lib/abc-workbench-installed\n"
  path: /usr/local/bin/abc-workbench-install
  permissions: '0755'
- content: '[Unit]

    Description=Install ABC-cluster workbench components

    After=network-online.target

    Wants=network-online.target

    ConditionPathExists=!/var/lib/abc-workbench-installed


    [Service]

    Type=oneshot

    # Started by the Pulumi program once every instance is up, never from

    # cloud-init. This install is disk- and network-heavy and runs for minutes;

    # left on the boot path it starved concurrently launching workers, which the

    # provider then failed on its fixed 900s launch budget.

    RemainAfterExit=yes

    TimeoutStartSec=2400

    ExecStart=/usr/local/bin/abc-workbench-install

    StandardOutput=journal+console


    [Install]

    WantedBy=multi-user.target

    '
  path: /etc/systemd/system/abc-workbench-install.service
  permissions: '0644'
- content: "#!/bin/bash\n# The Littlest JupyterHub, on the Nomad SERVER.\n#\n# WHY THE SERVER\n#   TLJH\
    \ manages per-user notebook servers as systemd units on one machine; it\n#   is not a Nomad spawner\
    \ and cannot spread users across the cluster. Putting\n#   it on the server keeps every worker free\
    \ for batch jobs and apps, which is\n#   what the workers are sized for. The server runs no Nomad\
    \ workloads, so the\n#   notebooks are not competing with scheduled work.\n#\n# WHY NOT THE NOMAD\
    \ SPAWNER\n#   An earlier revision used jupyterhub-nomad-spawner, which schedules each\n#   notebook\
    \ as a Nomad job. That pins the hub to Python 3.10 (the spawner\n#   declares Requires-Python >=3.10,<3.11\
    \ while Ubuntu 24.04 ships 3.12) and it\n#   puts interactive sessions on the same nodes as batch\
    \ work. TLJH avoids both.\nset -euo pipefail\n[ -x /opt/tljh/hub/bin/jupyterhub ] && { echo \"tljh\
    \ present\"; exit 0; }\nexport DEBIAN_FRONTEND=noninteractive\ncurl -fsSL https://tljh.jupyter.org/bootstrap.py\
    \ -o /tmp/tljh-bootstrap.py\n# --admin is required by the bootstrap; abc-auth-svc is the real gate\
    \ in front\n# of the hub, so this account exists only to satisfy TLJH's own bootstrap.\npython3 /tmp/tljh-bootstrap.py\
    \ --admin abc-admin >/tmp/tljh-install.log 2>&1 || {\n  echo \"tljh bootstrap failed; see /tmp/tljh-install.log\"\
    \ >&2\n  tail -5 /tmp/tljh-install.log >&2\n  exit 1\n}\nrm -f /tmp/tljh-bootstrap.py\n# Unified workbench\
    \ home (ADR-0064). The config file itself is written by\n# cloud-init; TLJH creates its jupyterhub_config.d\
    \ only at bootstrap time, so\n# the file is re-placed here in case the bootstrap overwrote the directory.\n\
    install -d -m 0755 /data/workbench\ninstall -d -m 0700 /opt/tljh/config/jupyterhub_config.d\nif [\
    \ -f /var/lib/abc-unified-home.py ]; then\n  install -m 0644 /var/lib/abc-unified-home.py \\\n   \
    \ /opt/tljh/config/jupyterhub_config.d/10-abc-unified-home.py\nfi\nif [ -f /var/lib/abc-auth-svc-hub.py\
    \ ]; then\n  install -m 0644 /var/lib/abc-auth-svc-hub.py \\\n    /opt/tljh/config/jupyterhub_config.d/20-abc-auth-svc.py\n\
    fi\nsystemctl restart jupyterhub || true\necho \"tljh installed\"\n"
  path: /usr/local/bin/abc-install-tljh
  permissions: '0755'
- content: "# ABC-cluster unified workbench home (ADR-0064).\n#\n# Each slot has ONE home: /data/workbench/<slot>/home,\
    \ which is also the Linux\n# passwd home (pw_dir) of jupyter-<slot>. There is no separate\n# /home/jupyter-<slot>.\
    \ Login shells, ssh, cron and the JupyterLab spawner all\n# resolve ~ to the same directory.\n#\n\
    # This is a contract, not a preference. abc-cluster-cli writes uploads to\n# /data/workbench/<slot>/home/data/\
    \ and reports that path back to the user on\n# \"abc workbench stop\"; abc-auth-svc's slot diagnostic\
    \ asserts the directory\n# exists and is owned by jupyter-<slot>. Stock TLJH would place the home\
    \ at\n# /home/jupyter-<slot> and both would be wrong.\n#\n# TLJH's UserCreatingSpawner calls tljh.user.ensure_user(),\
    \ which returns early\n# when the account already exists. Creating the account from a pre-spawn hook\n\
    # therefore fixes the home once, and TLJH leaves it alone.\nimport os\nimport pwd\nimport subprocess\n\
    \nWORKBENCH_ROOT = \"/data/workbench\"\n\n\ndef abc_unified_home(spawner):\n    slot = spawner.user.name\n\
    \    sys_user = \"jupyter-\" + slot\n    slot_root = os.path.join(WORKBENCH_ROOT, slot)\n    home\
    \ = os.path.join(slot_root, \"home\")\n\n    fresh = not os.path.isdir(home)\n    os.makedirs(home,\
    \ mode=0o700, exist_ok=True)\n\n    try:\n        pw = pwd.getpwnam(sys_user)\n    except KeyError:\n\
    \        # --home-dir without -m: the directory already exists above.\n        subprocess.check_call(\n\
    \            [\"useradd\", \"--home-dir\", home, \"--shell\", \"/bin/bash\", sys_user]\n        )\n\
    \        pw = pwd.getpwnam(sys_user)\n        fresh = True\n\n    if pw.pw_dir != home:\n        subprocess.check_call([\"\
    usermod\", \"--home\", home, sys_user])\n        fresh = True\n\n    owner = \"%s:%s\" % (sys_user,\
    \ sys_user)\n    if fresh:\n        subprocess.check_call([\"chown\", \"-R\", owner, slot_root])\n\
    \    else:\n        # Cheap per-spawn correction; a recursive chown over a populated home\n      \
    \  # would add seconds to every notebook start.\n        subprocess.check_call([\"chown\", owner,\
    \ slot_root, home])\n    os.chmod(home, 0o700)\n\n\nc.Spawner.notebook_dir = WORKBENCH_ROOT + \"/{username}/home\"\
    \nc.Spawner.default_url = \"/lab\"\nc.Spawner.pre_spawn_hook = abc_unified_home\n"
  path: /opt/tljh/config/jupyterhub_config.d/10-abc-unified-home.py
  permissions: '0644'
- content: "# ABC-cluster unified workbench home (ADR-0064).\n#\n# Each slot has ONE home: /data/workbench/<slot>/home,\
    \ which is also the Linux\n# passwd home (pw_dir) of jupyter-<slot>. There is no separate\n# /home/jupyter-<slot>.\
    \ Login shells, ssh, cron and the JupyterLab spawner all\n# resolve ~ to the same directory.\n#\n\
    # This is a contract, not a preference. abc-cluster-cli writes uploads to\n# /data/workbench/<slot>/home/data/\
    \ and reports that path back to the user on\n# \"abc workbench stop\"; abc-auth-svc's slot diagnostic\
    \ asserts the directory\n# exists and is owned by jupyter-<slot>. Stock TLJH would place the home\
    \ at\n# /home/jupyter-<slot> and both would be wrong.\n#\n# TLJH's UserCreatingSpawner calls tljh.user.ensure_user(),\
    \ which returns early\n# when the account already exists. Creating the account from a pre-spawn hook\n\
    # therefore fixes the home once, and TLJH leaves it alone.\nimport os\nimport pwd\nimport subprocess\n\
    \nWORKBENCH_ROOT = \"/data/workbench\"\n\n\ndef abc_unified_home(spawner):\n    slot = spawner.user.name\n\
    \    sys_user = \"jupyter-\" + slot\n    slot_root = os.path.join(WORKBENCH_ROOT, slot)\n    home\
    \ = os.path.join(slot_root, \"home\")\n\n    fresh = not os.path.isdir(home)\n    os.makedirs(home,\
    \ mode=0o700, exist_ok=True)\n\n    try:\n        pw = pwd.getpwnam(sys_user)\n    except KeyError:\n\
    \        # --home-dir without -m: the directory already exists above.\n        subprocess.check_call(\n\
    \            [\"useradd\", \"--home-dir\", home, \"--shell\", \"/bin/bash\", sys_user]\n        )\n\
    \        pw = pwd.getpwnam(sys_user)\n        fresh = True\n\n    if pw.pw_dir != home:\n        subprocess.check_call([\"\
    usermod\", \"--home\", home, sys_user])\n        fresh = True\n\n    owner = \"%s:%s\" % (sys_user,\
    \ sys_user)\n    if fresh:\n        subprocess.check_call([\"chown\", \"-R\", owner, slot_root])\n\
    \    else:\n        # Cheap per-spawn correction; a recursive chown over a populated home\n      \
    \  # would add seconds to every notebook start.\n        subprocess.check_call([\"chown\", owner,\
    \ slot_root, home])\n    os.chmod(home, 0o700)\n\n\nc.Spawner.notebook_dir = WORKBENCH_ROOT + \"/{username}/home\"\
    \nc.Spawner.default_url = \"/lab\"\nc.Spawner.pre_spawn_hook = abc_unified_home\n"
  path: /var/lib/abc-unified-home.py
  permissions: '0644'
- content: "#!/usr/bin/env python3\n\"\"\"Seed the workbench slot store: groups, one member slot each,\
    \ and a reviewer.\n\nRuns once, after PocketBase, JupyterHub and abc-auth-svc are up. Group and\n\
    member names are drawn at random per deployment so no two clusters share\nidentities; the chosen names\
    \ are printed and written to /run/abc-seed-out.json.\n\nNaming conventions below are load-bearing,\
    \ and each is asserted by a different\nconsumer:\n\n  PocketBase groups.name    bare, e.g. \"aardvark-transcriptomics\"\
    . abc-auth-svc\n                            prepends \"su-\" when rendering a slot's CLI config,\n\
    \                            so storing the prefix here yields \"su-su-...\".\n  Nomad namespace \
    \          \"su-<group>\"        \u2014 what that config points at.\n  MinIO bucket              \"\
    su-<group>\"        \u2014 same name as the namespace.\n  Nomad ACL policy          \"su-<group>-member\"\
    \ \u2014 the \"<ns>-member\" shape. The\n                            identity parser strips it to\
    \ the bare group name; a\n                            \"member-<ns>\" policy resolves to the right\
    \ namespace\n                            but leaves the prefix in the reported group label.\n  Nomad\
    \ token name          \"pool-<slot>\"       \u2014 maps to JupyterHub user\n                     \
    \       \"<slot>\", which fixes the workbench home directory.\n  slots.state               \"unclaimed\"\
    \         \u2014 the only state that\n                            POST /slots/claim will act on.\n\
    \nThe reviewer account is a super-admin: a Nomad *management* token (so\n/auth/me reports groups [\"\
    *\"] and namespace \"*\"), the MinIO consoleAdmin policy\nplus every group's member policy, and JupyterHub\
    \ admin rights.\n\"\"\"\nimport json, os, secrets, string, subprocess, sys, time, urllib.error, urllib.request\n\
    \nPB      = \"http://127.0.0.1:8091\"\nHUB     = \"http://127.0.0.1:15001/hub/api\"\nENVFILE = \"\
    /etc/abc/workbench.env\"\nOUTFILE = \"/run/abc-seed-out.json\"\n\nANIMALS = [\"kudu\", \"oryx\", \"\
    caracal\", \"serval\", \"duiker\", \"genet\", \"dassie\",\n           \"aardvark\", \"bontebok\",\
    \ \"suni\", \"eland\", \"klipspringer\"]\nFIELDS  = [\"genomics\", \"proteomics\", \"phylogenetics\"\
    , \"metagenomics\",\n           \"epidemiology\", \"virology\", \"microbiome\", \"transcriptomics\"\
    ]\nNAMES   = [\"thandiwe\", \"sipho\", \"naledi\", \"kagiso\", \"lerato\", \"tebogo\",\n         \
    \  \"amahle\", \"bongani\", \"zanele\", \"farai\", \"chipo\", \"tinashe\"]\n\nrng = secrets.SystemRandom()\n\
    \n\ndef envval(key):\n    try:\n        for line in open(ENVFILE):\n            if line.startswith(key\
    \ + \"=\"):\n                return line.split(\"=\", 1)[1].strip()\n    except OSError:\n       \
    \ pass\n    return \"\"\n\n\ndef nomad_bootstrap_token():\n    \"\"\"The bootstrap file holds the\
    \ whole `nomad acl bootstrap` table.\"\"\"\n    raw = open(\"/etc/nomad-bootstrap-token\").read()\n\
    \    for line in raw.splitlines():\n        if line.strip().startswith(\"Secret ID\"):\n         \
    \   return line.split(\"=\", 1)[1].strip()\n    return raw.strip()\n\n\ndef sh(cmd, check=True):\n\
    \    r = subprocess.run(cmd, shell=True, capture_output=True, text=True)\n    if check and r.returncode:\n\
    \        print(\"  ! \" + cmd.strip().split(\"\\n\")[0][:70], \"->\", r.stderr.strip()[:160])\n  \
    \  return r.stdout.strip()\n\n\ndef rand(n):\n    return \"\".join(rng.choice(string.ascii_uppercase\
    \ + string.digits) for _ in range(n))\n\n\ndef pb(path, body=None, method=\"GET\", token=\"\"):\n\
    \    data = json.dumps(body).encode() if body is not None else None\n    req = urllib.request.Request(PB\
    \ + path, data=data, method=method,\n        headers={\"Content-Type\": \"application/json\", \"Authorization\"\
    : token})\n    try:\n        out = urllib.request.urlopen(req, timeout=15).read()\n        return\
    \ json.loads(out) if out.strip() else {}\n    except urllib.error.HTTPError as e:\n        print(\"\
    \  ! PB\", method, path, e.code, e.read().decode()[:200])\n        return None\n\n\ndef hub(path,\
    \ jht, body=None, method=\"POST\"):\n    data = json.dumps(body).encode() if body is not None else\
    \ None\n    req = urllib.request.Request(HUB + path, data=data, method=method,\n        headers={\"\
    Authorization\": \"token \" + jht, \"Content-Type\": \"application/json\"})\n    try:\n        return\
    \ urllib.request.urlopen(req, timeout=15).status\n    except urllib.error.HTTPError as e:\n      \
    \  return e.code\n\n\ndef pb_superuser_token():\n    \"\"\"Create the PocketBase superuser if absent,\
    \ then authenticate as it.\n\n    PocketBase rejects abc-auth-svc's built-in default of \"abc-auth@internal\"\
    \n    as an invalid address, so the deployment pins a reserved-TLD address\n    (RFC 2606) in workbench.env\
    \ and both sides read it from there.\n    \"\"\"\n    email, password = envval(\"PB_ADMIN_EMAIL\"\
    ), envval(\"PB_ADMIN_PASSWORD\")\n    if not email:\n        email = \"abc-auth@abc.invalid\"\n  \
    \      with open(ENVFILE, \"a\") as f:\n            f.write(\"PB_ADMIN_EMAIL=%s\\n\" % email)\n\n\
    \    def authenticate():\n        body = json.dumps({\"identity\": email, \"password\": password}).encode()\n\
    \        req = urllib.request.Request(PB + \"/api/collections/_superusers/auth-with-password\",\n\
    \            data=body, headers={\"Content-Type\": \"application/json\"}, method=\"POST\")\n     \
    \   try:\n            return json.load(urllib.request.urlopen(req, timeout=15)).get(\"token\", \"\"\
    )\n        except urllib.error.HTTPError:\n            return \"\"\n\n    tok = authenticate()\n \
    \   if tok:\n        return tok\n\n    # No superuser yet. `superuser upsert` writes straight into\
    \ the SQLite file\n    # under the running server and rotates the account's token key, which\n   \
    \ # invalidates the tokens abc-auth-svc is holding \u2014 so restart both the\n    # store and the\
    \ broker afterwards rather than only creating the account.\n    sh('/usr/local/bin/pocketbase superuser\
    \ upsert \"%s\" \"%s\" --dir /opt/abc/pb_data'\n       % (email, password), check=False)\n    sh(\"\
    systemctl restart abc-pocketbase\", check=False)\n    for _ in range(15):\n        time.sleep(1)\n\
    \        tok = authenticate()\n        if tok:\n            break\n    sh(\"systemctl restart abc-auth-svc\"\
    , check=False)\n    time.sleep(3)\n    return tok\n\n\ndef ensure_collections(tok):\n    \"\"\"Create\
    \ the groups/slots collections abc-auth-svc reads, if absent.\"\"\"\n    have = {c[\"name\"] for c\
    \ in (pb(\"/api/collections?perPage=200\", token=tok) or {}).get(\"items\", [])}\n    txt = lambda\
    \ n: {\"name\": n, \"type\": \"text\"}\n    if \"groups\" not in have:\n        g = pb(\"/api/collections\"\
    , {\"name\": \"groups\", \"type\": \"base\", \"fields\": [\n            {\"name\": \"name\", \"type\"\
    : \"text\", \"required\": True},\n            txt(\"cred_source_default\"), txt(\"age_recipient\"\
    ), txt(\"age_sk_wrapped\"),\n            {\"name\": \"age_key_version\", \"type\": \"number\"},\n\
