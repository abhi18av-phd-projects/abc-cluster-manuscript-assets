#cloud-config
packages:
- git
- curl
- unzip
runcmd:
- systemctl daemon-reload
- systemctl enable abc-workbench-install.service
write_files:
- content: 'export PATH=/usr/local/go/bin:$PATH

    '
  path: /etc/profile.d/go.sh
  permissions: '0644'
- content: "#!/bin/bash\n# Build abc-auth-svc from source into /opt/abc-auth-svc/.\nset -euo pipefail\nexport PATH=/usr/local/go/bin:$PATH\nGO_VERSION=${GO_VERSION:-1.27.0}\nif ! command -v go >/dev/null 2>&1; then\n  curl -fsSL \"https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz\" -o /tmp/go.tgz\n  rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz && rm -f /tmp/go.tgz\nfi\nrm -rf /tmp/abc-auth-svc\ngit clone --depth 1 https://github.com/abc-cluster/abc-auth-svc.git /tmp/abc-auth-svc\nmkdir -p /opt/abc-auth-svc\ncd /tmp/abc-auth-svc\n# Module downloads fail intermittently while the rest of the workbench\n# installs concurrently; observed once in three provisions. Retry rather\n# than leave the node without its credential broker.\nfor attempt in 1 2 3; do\n  if go build -trimpath -o /opt/abc-auth-svc/abc-auth-svc .; then break; fi\n  echo \"go build attempt $attempt failed; retrying\"\n  sleep 10\ndone\n[ -x /opt/abc-auth-svc/abc-auth-svc ] || { echo \"auth-svc build failed after\
    \ 3 attempts\"; exit 1; }\n/opt/abc-auth-svc/abc-auth-svc -version || true\necho \"abc-auth-svc built\"\n"
  path: /usr/local/bin/abc-install-authsvc
  permissions: '0755'
- content: "#!/bin/bash\n# PocketBase holds workbench slot state. Published as a static binary.\nset -euo pipefail\nPB_VERSION=${PB_VERSION:-0.23.4}\ncommand -v pocketbase >/dev/null 2>&1 && { echo \"pocketbase present\"; exit 0; }\ncurl -fsSL -o /tmp/pb.zip \\\n  \"https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip\"\nunzip -o -q /tmp/pb.zip -d /tmp/pb && install -m 0755 /tmp/pb/pocketbase /usr/local/bin/pocketbase\nrm -rf /tmp/pb /tmp/pb.zip\nmkdir -p /opt/abc/pb_data\necho \"pocketbase installed\"\n"
  path: /usr/local/bin/abc-install-pocketbase
  permissions: '0755'
- content: '# Generated at provision time by abc-workbench-secrets.

    # Secrets are read from the environment only, never from flags.

    '
  path: /etc/abc/workbench.env
  permissions: '0640'
- content: '#!/bin/bash

    # Generate the per-deployment secrets the workbench services share.

    # Regenerating them invalidates existing sessions, so only generate once.

    set -euo pipefail

    mkdir -p /etc/abc

    f=/etc/abc/workbench.env

    grep -q SESSION_SECRET "$f" 2>/dev/null && { echo "secrets present"; exit 0; }

    gen() { head -c 32 /dev/urandom | base64 | tr -d ''\n=''; }

    cat > "$f" <<ENV

    SESSION_SECRET=$(gen)

    PB_ADMIN_PASSWORD=$(gen)

    OPERATOR_TOKEN=$(gen)

    ENV

    chmod 0640 "$f"

    echo "workbench secrets generated"

    '
  path: /usr/local/bin/abc-workbench-secrets
  permissions: '0755'
- content: '#!/bin/bash

    # Report which workbench components are present. Printed at the end of

    # provisioning so a half-built node is visible rather than silent.

    ok=0; bad=0

    chk() { if eval "$2"; then echo "  ok      $1"; ok=$((ok+1)); else echo "  MISSING $1"; bad=$((bad+1)); fi; }

    echo "WORKBENCH components:"

    chk "pocketbase"   "command -v pocketbase >/dev/null"

    chk "tljh"         "[ -x /opt/tljh/hub/bin/jupyterhub ]"

    chk "abc-auth-svc" "[ -x /opt/abc-auth-svc/abc-auth-svc ]"

    chk "secrets"      "grep -q SESSION_SECRET /etc/abc/workbench.env 2>/dev/null"

    echo "WORKBENCH: $ok present, $bad missing"

    '
  path: /usr/local/bin/abc-workbench-status
  permissions: '0755'
- content: '[Unit]

    Description=PocketBase (workbench slot store)

    After=network-online.target

    Wants=network-online.target


    [Service]

    ExecStart=/usr/local/bin/pocketbase serve --http 127.0.0.1:8091 --dir /opt/abc/pb_data

    Restart=always

    RestartSec=3


    [Install]

    WantedBy=multi-user.target

    '
  path: /etc/systemd/system/abc-pocketbase.service
  permissions: '0644'
- content: '[Unit]

    Description=abc-auth-svc (workbench forward-auth and credential broker)

    After=abc-pocketbase.service

    Wants=abc-pocketbase.service


    [Service]

    # Secrets come from the environment only, never from flags, and the service

    # registers each one with its log redactor.

    EnvironmentFile=-/etc/abc/workbench.env

    EnvironmentFile=-/etc/abc/workbench-cluster.env

    ExecStart=/opt/abc-auth-svc/abc-auth-svc

    Restart=always

    RestartSec=3


    [Install]

    WantedBy=multi-user.target

    '
  path: /etc/systemd/system/abc-auth-svc.service
  permissions: '0644'
- content: "#!/bin/bash\n# Install every workbench component. Runs as a systemd oneshot AFTER boot\n# rather than from cloud-init, because these installs take several minutes and\n# cloud-init's package stage runs before runcmd \u2014 putting them inline delayed\n# the Nomad ACL bootstrap past its readiness window and failed the deployment.\nset -uo pipefail\nexport DEBIAN_FRONTEND=noninteractive\napt-get update -qq >/dev/null 2>&1\napt-get install -y -qq python3-pip sqlite3 >/dev/null 2>&1\n/usr/local/bin/abc-workbench-secrets   || echo \"WORKBENCH secrets step failed\"\n/usr/local/bin/abc-install-pocketbase  || echo \"WORKBENCH pocketbase step failed\"\n/usr/local/bin/abc-install-tljh        || echo \"WORKBENCH tljh step failed\"\n/usr/local/bin/abc-install-authsvc     || echo \"WORKBENCH auth-svc step failed\"\nsystemctl daemon-reload\nsystemctl enable --now abc-pocketbase.service || echo \"WORKBENCH pocketbase service failed\"\n/usr/local/bin/abc-workbench-status\ntouch /var/lib/abc-workbench-installed\n"
  path: /usr/local/bin/abc-workbench-install
  permissions: '0755'
- content: '[Unit]

    Description=Install ABC-cluster workbench components

    After=network-online.target

    Wants=network-online.target

    ConditionPathExists=!/var/lib/abc-workbench-installed


    [Service]

    Type=oneshot

    # Started by the Pulumi program once every instance is up, never from

    # cloud-init. This install is disk- and network-heavy and runs for minutes;

    # left on the boot path it starved concurrently launching workers, which the

    # provider then failed on its fixed 900s launch budget.

    RemainAfterExit=yes

    TimeoutStartSec=2400

    ExecStart=/usr/local/bin/abc-workbench-install

    StandardOutput=journal+console


    [Install]

    WantedBy=multi-user.target

    '
  path: /etc/systemd/system/abc-workbench-install.service
  permissions: '0644'
- content: "#!/bin/bash\n# The Littlest JupyterHub, on the Nomad SERVER.\n#\n# WHY THE SERVER\n#   TLJH manages per-user notebook servers as systemd units on one machine; it\n#   is not a Nomad spawner and cannot spread users across the cluster. Putting\n#   it on the server keeps every worker free for batch jobs and apps, which is\n#   what the workers are sized for. The server runs no Nomad workloads, so the\n#   notebooks are not competing with scheduled work.\n#\n# WHY NOT THE NOMAD SPAWNER\n#   An earlier revision used jupyterhub-nomad-spawner, which schedules each\n#   notebook as a Nomad job. That pins the hub to Python 3.10 (the spawner\n#   declares Requires-Python >=3.10,<3.11 while Ubuntu 24.04 ships 3.12) and it\n#   puts interactive sessions on the same nodes as batch work. TLJH avoids both.\nset -euo pipefail\n[ -x /opt/tljh/hub/bin/jupyterhub ] && { echo \"tljh present\"; exit 0; }\nexport DEBIAN_FRONTEND=noninteractive\ncurl -fsSL https://tljh.jupyter.org/bootstrap.py -o\
    \ /tmp/tljh-bootstrap.py\n# --admin is required by the bootstrap; abc-auth-svc is the real gate in front\n# of the hub, so this account exists only to satisfy TLJH's own bootstrap.\npython3 /tmp/tljh-bootstrap.py --admin abc-admin >/tmp/tljh-install.log 2>&1 || {\n  echo \"tljh bootstrap failed; see /tmp/tljh-install.log\" >&2\n  tail -5 /tmp/tljh-install.log >&2\n  exit 1\n}\nrm -f /tmp/tljh-bootstrap.py\necho \"tljh installed\"\n"
  path: /usr/local/bin/abc-install-tljh
  permissions: '0755'
