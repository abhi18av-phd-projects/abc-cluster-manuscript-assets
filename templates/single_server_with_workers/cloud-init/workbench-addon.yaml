    \ job submission with a bare 403.\n        pol = \"/tmp/pol-%s.hcl\" % ns\n        tmpl = \"/etc/nomad-policies/member.hcl.tmpl\"\
    \n        if os.path.exists(tmpl):\n            open(pol, \"w\").write(open(tmpl).read().replace(\"\
    __GROUP__\", ns))\n        else:\n            open(pol, \"w\").write(\n                'namespace\
    \ \"%s\" {\\n'\n                '  policy       = \"read\"\\n'\n                '  capabilities =\
    \ [\"submit-job\", \"dispatch-job\", \"read-job\", '\n                '\"list-jobs\", \"read-logs\"\
    , \"read-fs\"]\\n'\n                '}\\n'\n                'node { policy = \"read\" }\\n'\n    \
    \            'host_volume \"nf-work\" { policy = \"write\" }\\n' % ns)\n        sh('nomad acl policy\
    \ apply -description \"member %s\" %s-member %s' % (ns, ns, pol))\n\n        sh(\"mc mb --ignore-existing\
    \ abc/%s\" % bucket, check=False)\n        ip = \"/tmp/iam-%s.json\" % ns\n        open(ip, \"w\"\
    ).write(json.dumps({\"Version\": \"2012-10-17\", \"Statement\": [\n            {\"Effect\": \"Allow\"\
    , \"Action\": [\"s3:*\"], \"Resource\": [\"arn:aws:s3:::%s/*\" % bucket]},\n            {\"Effect\"\
    : \"Allow\", \"Action\": [\"s3:ListBucket\"], \"Resource\": [\"arn:aws:s3:::%s\" % bucket]}]}))\n\
    \        sh(\"mc admin policy create abc %s-member %s || mc admin policy update abc %s-member %s\"\
    \n           % (ns, ip, ns, ip), check=False)\n\n        grec = pb(\"/api/collections/groups/records\"\
    ,\n                  {\"name\": name, \"cred_source_default\": \"local\"}, \"POST\", tok)\n      \
    \  ak, sk = (\"%s-%s\" % (member, rand(6))).lower(), rand(24)\n        minio_user(ak, sk, [\"%s-member\"\
    \ % ns])\n        td = json.loads(sh('nomad acl token create -name \"pool-%s\" -policy \"%s-member\"\
    \ '\n                           '-type=client -json' % (member, ns)) or \"{}\")\n        code = rand(10)\n\
    \        srec = pb(\"/api/collections/slots/records\", {\n            \"slot_name\": member, \"group\"\
    : grec[\"id\"] if grec else None, \"group_name\": name,\n            \"minio_access_key\": ak, \"\
    minio_secret_key\": sk,\n            \"nomad_token_secret\": td.get(\"SecretID\", \"\"),\n       \
    \     \"nomad_token_accessor\": td.get(\"AccessorID\", \"\"),\n            \"state\": \"unclaimed\"\
    , \"cred_source\": \"local\", \"claim_code\": code}, \"POST\", tok)\n        if jht:\n           \
    \ hub(\"/users/\" + member, jht)\n        out[\"groups\"].append({\"group\": name, \"namespace\":\
