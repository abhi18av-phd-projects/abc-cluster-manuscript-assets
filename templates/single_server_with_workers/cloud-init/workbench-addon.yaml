    \ OSError:\n        pass\n    if not endpoint:\n        print(\"  ! CLUSTER_MINIO_ENDPOINT unset;\
    \ cannot configure mc alias\")\n        return False\n    user = os.environ.get(\"MINIO_ROOT_USER\"\
    , \"minioadmin\")\n    pw   = os.environ.get(\"MINIO_ROOT_PASSWORD\", \"minioadmin\")\n    sh(\"mc\
