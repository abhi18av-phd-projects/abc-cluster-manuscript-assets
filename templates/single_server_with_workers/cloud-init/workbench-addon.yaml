    mc admin user add abc %s %s\" % (ak, sk), check=False)\n        for p in policies:\n            sh(\"\
    mc admin policy attach abc %s --user %s\" % (p, ak), check=False)\n\n    for i, name in enumerate(bare):\n\
    \        member = members[i]\n        ns = bucket = \"su-\" + name\n        print(\"== %s (namespace\
    \ %s, member %s) ==\" % (name, ns, member))\n\n        sh('nomad namespace apply -description \"group\
