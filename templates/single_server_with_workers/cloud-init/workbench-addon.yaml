    \ info abc\", shell=True,\n                        capture_output=True).returncode == 0\n    print(\"\
    \  mc alias abc -> %s (%s)\" % (endpoint, \"ok\" if ok else \"UNREACHABLE\"))\n    return ok\n\n\n\
    def grant_hub_admin(slot):\n    \"\"\"Add a slot to TLJH's admin list.\n\n    PATCHing admin=true\
    \ through the hub API is refused: the abc-auth-svc\n    service role can create and read users but\
