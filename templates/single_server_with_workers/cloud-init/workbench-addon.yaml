- content: "#!/bin/bash\n# Secrets the workbench needs beyond the base set: a PocketBase superuser\n#\
    \ address PocketBase will actually accept, and the JupyterHub API token shared\n# with abc-auth-svc.\
    \ Both are appended once and then left alone, so a re-run\n# never rotates a live deployment's credentials.\n\
    set -euo pipefail\ntouch /etc/abc/workbench.env\nchmod 600 /etc/abc/workbench.env\n# abc-auth-svc\
    \ defaults to \"abc-auth@internal\", which PocketBase rejects as an\n# invalid address. .invalid is\
    \ the RFC 2606 reserved TLD for exactly this.\ngrep -q '^PB_ADMIN_EMAIL=' /etc/abc/workbench.env ||\
    \ \\\n  echo \"PB_ADMIN_EMAIL=abc-auth@abc.invalid\" >> /etc/abc/workbench.env\ngrep -q '^JUPYTERHUB_API_TOKEN='\
    \ /etc/abc/workbench.env || \\\n  echo \"JUPYTERHUB_API_TOKEN=$(openssl rand -hex 32)\" >> /etc/abc/workbench.env\n"
